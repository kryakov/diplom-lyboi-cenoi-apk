name: Web version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build with pygbag
        run: |
          pip install pygbag==0.9.3
          mkdir -p stage/diplom
          cp -r main.py src data assets stage/diplom/
          cp icon.png stage/diplom/favicon.png
          python -m pygbag --build --title "Диплом любой ценой" stage/diplom
          cd stage/diplom/build/web
          sed -i 's|<meta name="apple-mobile-web-app-capable" content="yes"/>|&<link rel="apple-touch-icon" href="favicon.png"/><link rel="manifest" href="manifest.webmanifest"/>|' index.html
          cat > manifest.webmanifest <<'JSON'
          {
            "name": "Диплом любой ценой",
            "short_name": "Диплом",
            "start_url": "./",
            "display": "fullscreen",
            "orientation": "landscape",
            "background_color": "#1C1C2E",
            "theme_color": "#1C1C2E",
            "icons": [{"src": "favicon.png", "sizes": "512x512", "type": "image/png"}]
          }
          JSON
          grep -c manifest index.html
          ls -l

      - uses: actions/upload-pages-artifact@v3
        with:
          path: stage/diplom/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
