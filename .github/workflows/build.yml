name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config cmake \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 libffi-dev libssl-dev

      - name: Buildozer
        run: pip install --upgrade buildozer "cython<3" setuptools

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Show the end of the log on failure
        if: failure()
        run: |
          grep -v "^\s*$" build.log | tail -n 80 > tail.log || true
          msg=$(sed -e 's/%/%25/g' tail.log | awk '{printf "%s%%0A", $0}')
          echo "::error title=buildozer log tail::$msg"
          grep -n -i -E "error|exception|failed" build.log | tail -n 40 > errs.log || true
          msg=$(sed -e 's/%/%25/g' errs.log | awk '{printf "%s%%0A", $0}')
          echo "::error title=buildozer errors::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: diplom-apk
          path: bin/*.apk
