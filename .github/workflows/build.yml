name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config cmake \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 libffi-dev libssl-dev

      - name: Buildozer
        run: pip install --upgrade buildozer "cython<3" setuptools

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Show the error part of the log on failure
        if: failure()
        run: |
          sed -e 's/\x1b\[[0-9;]*m//g' build.log > clean.log
          n=$(grep -n -E "BUILD FAILED|FAILURE:|Command failed|filename not found|BuildozerCommandException" clean.log | tail -n 1 | cut -d: -f1)
          [ -z "$n" ] && n=$(wc -l < clean.log)
          from=$((n > 90 ? n - 90 : 1))
          sed -n "${from},$((n + 6))p" clean.log | grep -v -E "^\s*$|clang |\+\+ " | cut -c1-220 > part.log
          split -l 12 part.log chunk_
          for f in chunk_*; do
            msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::error title=log $f::$msg"
          done
          grep -n -E "error:|Error:|No module named|not found|FAILED|What went wrong" clean.log | grep -v -E "Werror|SyntaxError|DEBUG\]:\s+/" | tail -n 12 | cut -c1-220 > errs.log || true
          msg=$(sed -e 's/%/%25/g' errs.log | awk '{printf "%s%%0A", $0}')
          echo "::error title=error lines::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: diplom-apk
          path: bin/*.apk
